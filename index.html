<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b19" />
    <meta name="description" content="Next, Please! — czarna komedia o medycynie pracy, papierologii i wątpliwych decyzjach." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Next, Please! — Następny, proszę!</title>
  </head>
  <body>
    <main id="app">
      <section id="viewport" aria-label="Next, Please!">
        <div id="stage">
          <canvas id="game" width="570" height="320" aria-hidden="true"></canvas>
          <div id="controls"></div>
        </div>
      </section>
      <div class="surround-bottom">
        <div id="session-controls"></div>
        <div id="utility-controls" role="group"></div>
      </div>
      <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
      <p id="patient-speech" class="sr-only" aria-live="polite" aria-atomic="true"></p>
      <input id="save-input" type="file" accept=".npsave,application/gzip" hidden />
    </main>
    <noscript>Do gry potrzebny jest JavaScript. / JavaScript is required to play.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
